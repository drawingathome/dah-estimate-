[build]
  command = "npm run build && cp dah-estimate.html dist/"
  publish = "dist"

[[redirects]]
  from = "/dah-dashboard.html"
  to = "/dah-dashboard.html"
  status = 200

[[redirects]]
  from = "/dah-estimate.html"
  to = "/dah-estimate.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
