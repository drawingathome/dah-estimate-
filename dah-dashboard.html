<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>드로잉엣홈 대시보드</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:#F5F1EC;color:#1A1A1A;font-size:13px;line-height:1.5;min-height:100vh}
/* 로그인 */
.login-screen{
  position:fixed;inset:0;background:#1A1A1A;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9999;padding:24px
}
.login-brand-text{
  color:#FAF7F5;font-size:10px;font-weight:300;
  letter-spacing:6px;text-transform:uppercase;
  margin-bottom:28px;opacity:0.4;text-align:center
}
.login-card{
  width:100%;max-width:360px;background:#fff;
  padding:32px 28px;border-radius:12px
}
.login-title{font-size:18px;font-weight:700;color:#1A1A1A;margin-bottom:4px}
.login-sub{font-size:13px;color:#ADADAD;margin-bottom:24px}
.user-btn{
  width:100%;padding:14px 16px;
  border:1.5px solid #E8E4DE;background:#fff;
  font-size:14px;font-family:inherit;cursor:pointer;
  text-align:left;display:flex;align-items:center;
  gap:12px;transition:all 0.15s;margin-bottom:8px;
  border-radius:8px
}
.user-btn:hover{border-color:#1A1A1A;background:#FAFAF8}
.user-btn.master{border-left:4px solid #D4622A}
.user-btn-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.user-btn-name{font-size:14px;font-weight:700;color:#1A1A1A;display:block}
.user-btn-desc{font-size:11px;color:#ADADAD;display:block;margin-top:2px}
.master-pw-wrap{margin-top:10px;display:none}
#master-pw-input{
  width:100%;padding:13px 14px;
  border:1.5px solid #E8E4DE;
  font-size:14px;font-family:inherit;
  outline:none;background:#fff;
  -webkit-appearance:none;display:block;
  margin-bottom:8px;border-radius:8px
}
#master-pw-input:focus{border-color:#1A1A1A}
#btn-master-confirm{
  width:100%;padding:13px;
  background:#1A1A1A;color:#fff;border:none;
  font-size:13px;font-weight:700;font-family:inherit;
  cursor:pointer;letter-spacing:0.3px;display:block;
  border-radius:8px
}
.master-pw-error{font-size:12px;color:#D4622A;text-align:center;margin-top:6px;display:none}
.pw-wrap{margin-top:10px;display:none}
.pw-inp{
  width:100%;padding:13px 14px;
  border:1.5px solid #E8E4DE;
  font-size:14px;font-family:inherit;
  outline:none;background:#fff;
  -webkit-appearance:none;margin-bottom:8px;
  display:block;border-radius:8px
}
.pw-inp:focus{border-color:#1A1A1A}
.pw-btn{
  width:100%;padding:13px;
  background:#1A1A1A;color:#fff;border:none;
  font-size:13px;font-weight:700;font-family:inherit;
  cursor:pointer;display:block;border-radius:8px
}
.pw-err{font-size:12px;color:#D4622A;text-align:center;margin-top:6px;display:none}
/* 헤더 */
.hd{position:sticky;top:0;z-index:100;background:#1A1A1A;padding:0 14px;height:48px;display:flex;align-items:center;justify-content:space-between;max-width:100%}
.hd-logo{color:#FAF7F5;font-size:9px;font-weight:300;letter-spacing:4px;text-transform:uppercase;opacity:0.85;white-space:nowrap}
.hd-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
#current-user-badge{font-size:9px;color:#FAF7F5;opacity:0.45;letter-spacing:0.5px;white-space:nowrap;margin-left:6px;padding-left:8px;border-left:1px solid rgba(255,255,255,0.15)}
.hd-btn{padding:5px 10px;font-size:10px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:0.3px;white-space:nowrap;border:none;flex-shrink:0;line-height:1.4;border-radius:4px}
.backup-btn{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.15)!important}
.backup-btn:hover{background:rgba(255,255,255,0.18)}
.new-btn,.switch-btn{background:#D4622A;color:#fff}
.new-btn:hover,.switch-btn:hover{background:#bf5525}
/* 탭 */
.nav,.tabs{background:#fff;border-bottom:1px solid #E8E4DE;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:48px;z-index:99}
.nav::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;padding:12px 4px;font-size:11px;font-weight:600;font-family:inherit;color:#ADADAD;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;letter-spacing:0;transition:all 0.15s;white-space:nowrap;text-align:center}
.tab.active,.tab.on{color:#1A1A1A;border-bottom-color:#D4622A;font-weight:700}
/* 콘텐츠 공통 */
.content,.wrap{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid #E8E4DE;margin-bottom:10px;padding:16px 18px;border-radius:10px}
.card-label{font-size:11px;font-weight:700;color:#ADADAD;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
/* 홈 */
.home-greeting{padding:16px 16px 4px}
.home-date{font-size:10px;color:#A8A8A8;letter-spacing:0.5px;margin-bottom:3px}
.home-name{font-size:18px;font-weight:700;color:#1A1A1A}
.new-est-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:#1A1A1A;color:#FAF7F5;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:0.5px;margin-bottom:10px}
.new-est-btn:active{background:#282828}
/* 통계 그리드 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;background:#E8E4DE;gap:1px;border:1px solid #E8E4DE;margin-bottom:10px}
.stat-item{background:#fff;padding:13px 8px;text-align:center}
.stat-val{font-size:13px;font-weight:700;color:#D4622A;display:block;margin-bottom:2px}
.stat-val.dark{color:#1A1A1A}
.stat-lbl{font-size:9px;color:#A8A8A8;letter-spacing:0.3px}
/* 진행 현황 바 */
.stage-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.stage-chip{padding:8px 3px;text-align:center;cursor:pointer;background:#fff;border:1px solid #E8E4DE;transition:opacity 0.15s}
.stage-chip:active{opacity:0.7}
.sc-n{font-size:14px;font-weight:700;display:block;margin-bottom:2px}
.sc-l{font-size:9px;color:#A8A8A8;letter-spacing:0.3px}
/* 고객 아이템 */
.cust-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F0EDE8;cursor:pointer}
.cust-item:last-child{border-bottom:none}
.cust-item:active{opacity:0.7}
.ci-name{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:2px}
.ci-sub{font-size:10px;color:#A8A8A8}
.stage-badge{font-size:10px;font-weight:700;padding:3px 8px;white-space:nowrap}
/* 진행현황 파이프라인 */
.pipe-search-wrap{position:relative;margin-bottom:10px}
.pipe-search-wrap::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:10px;pointer-events:none}
.search-input{width:100%;padding:10px 12px 10px 32px;border:1px solid #E8E4DE;background:#fff;font-size:12px;font-family:inherit;outline:none;-webkit-appearance:none}
.search-input:focus{border-color:#1A1A1A}
.pipe-stage{margin-bottom:8px}
.pipe-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer}
.pipe-hd-name{font-size:10px;font-weight:700;letter-spacing:0.5px}
.pipe-hd-cnt{font-size:10px;color:#A8A8A8}
.pipe-card{background:#fff;border:1px solid #E8E4DE;border-left:2px solid;padding:11px 13px;margin-top:4px;cursor:pointer}
.pipe-card:active{opacity:0.7}
.pc-name{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:3px}
.pc-sub{display:flex;gap:8px;font-size:10px;color:#A8A8A8}
.pc-price{font-size:11px;font-weight:700;color:#D4622A}
.pipe-empty{font-size:11px;color:#C0B8B0;padding:6px 12px;font-style:italic}
/* 고객목록 */
.cust-row{background:#fff;border:1px solid #E8E4DE;padding:11px 13px;margin-bottom:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.cust-row:hover{border-color:#1A1A1A}
.cr-name{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:2px}
.cr-sub{font-size:10px;color:#A8A8A8}
.cr-price{font-size:11px;font-weight:700;color:#1A1A1A;text-align:right;margin-bottom:2px}
/* 오버레이/모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
.overlay.open{opacity:1;pointer-events:auto}
.bottom-sheet{width:100%;max-height:88vh;background:#fff;border-radius:12px 12px 0 0;overflow-y:auto;transform:translateY(16px);transition:transform 0.2s;padding-bottom:32px}
.overlay.open .bottom-sheet{transform:translateY(0)}
.bs-handle{width:30px;height:3px;background:#E4E0DA;margin:11px auto 0}
.bs-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 11px;border-bottom:1px solid #F0EDE8}
.bs-title{font-size:15px;font-weight:700}
#detail-close-btn,.bs-close-btn{width:26px;height:26px;border:none;background:#F5F1EC;cursor:pointer;font-size:12px;color:#6B6B6B;display:flex;align-items:center;justify-content:center}
.bs-body{padding:16px}
.bs-sec{margin-bottom:16px}
.bs-sec-lbl{font-size:10px;font-weight:700;color:#A8A8A8;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.bs-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F5F1EC}
.bs-row:last-child{border-bottom:none}
.bs-key{font-size:11px;color:#A8A8A8}
.bs-val{font-size:12px;font-weight:600;color:#1A1A1A}
.stage-pills{display:flex;gap:4px;flex-wrap:wrap}
.stage-pill{padding:5px 10px;font-size:10px;font-weight:700;border:1px solid #E4E0DA;cursor:pointer;font-family:inherit;background:#fff;color:#6B6B6B;transition:all 0.15s}
.stage-pill.active{background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.alim-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.alim-btn{padding:10px 11px;border:1px solid #E8E4DE;cursor:pointer;text-align:left;background:#fff;font-family:inherit}
.alim-btn:active{background:#F7F4F0}
.alim-btn .ab-label{font-size:11px;font-weight:700;color:#1A1A1A;display:block;margin-bottom:2px}
.alim-btn .ab-desc{font-size:10px;color:#A8A8A8;display:block}
.alim-btn.t-orange{border-left:2px solid #D4622A}
.alim-btn.t-blue{border-left:2px solid #0ea5e9}
.alim-btn.t-green{border-left:2px solid #16a34a}
.alim-btn.t-amber{border-left:2px solid #b45309}
.log-box{background:#F5F1EC;padding:9px 11px;min-height:34px;margin-top:6px}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #EDE9E3;font-size:10px}
.log-row:last-child{border-bottom:none}
.lr-type{font-weight:600;color:#1A1A1A}
.lr-time{color:#A8A8A8}
.lr-method{padding:1px 6px;background:#fff;color:#6B6B6B;border:1px solid #E4E0DA;font-size:9px}
.log-empty-txt{font-size:11px;color:#A8A8A8;font-style:italic}
.kakao-copy-btn{width:100%;padding:9px;border:1px solid #E8E4DE;font-size:11px;color:#6B6B6B;background:#fff;cursor:pointer;font-family:inherit;margin-top:6px}
.bs-actions{padding:11px 16px;border-top:1px solid #F0EDE8;display:flex;gap:6px}
.bsa-btn{flex:1;padding:11px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;border:none}
.bsa-outline{background:#fff;color:#1A1A1A;border:1px solid #E4E0DA}
.bsa-dark{background:#1A1A1A;color:#fff}
.bsa-danger{background:#fff;color:#D4622A;border:1px solid #fecaca}
/* 고객추가 오버레이 */
.add-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s}
.add-overlay.open{opacity:1;pointer-events:auto}
.add-sheet{width:100%;max-height:90vh;background:#fff;border-radius:12px 12px 0 0;overflow-y:auto;transform:translateY(16px);transition:transform 0.2s;padding:16px 16px 48px}
.add-overlay.open .add-sheet{transform:translateY(0)}
.add-field{margin-bottom:11px}
.add-field label{font-size:10px;font-weight:700;color:#A8A8A8;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:5px}
.add-field input,.add-field select,.add-field textarea{width:100%;padding:10px 12px;border:1px solid #E4E0DA;font-size:13px;font-family:inherit;outline:none;background:#fff;-webkit-appearance:none}
.add-field input:focus,.add-field select:focus{border-color:#1A1A1A}
/* 일정 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month-txt{font-size:14px;font-weight:700}
.cal-nav-btn{background:none;border:none;font-size:16px;cursor:pointer;color:#6B6B6B;padding:2px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px}
.cal-dow{font-size:9px;font-weight:700;color:#A8A8A8;text-align:center;padding:4px 0;letter-spacing:0.5px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#1A1A1A;position:relative;cursor:pointer}
.cal-day.today{background:#1A1A1A;color:#fff;font-weight:700}
.cal-day.has-event::after{content:'';width:4px;height:4px;background:#D4622A;border-radius:50%;position:absolute;bottom:1px}
.cal-day.other-month{color:#C8C4BD}
.cal-event-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #F0EDE8;cursor:pointer}
.cal-event-item:last-child{border-bottom:none}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-ev-name{font-size:13px;font-weight:600;color:#1A1A1A}
.cal-ev-sub{font-size:10px;color:#A8A8A8;margin-top:1px}
/* 매출 */
.chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.chart-bar-label{font-size:10px;color:#A8A8A8;width:22px;text-align:right;flex-shrink:0}
.chart-bar-track{flex:1;height:5px;background:#F0EDE8;overflow:hidden}
.chart-bar-fill{height:100%;background:#D4622A;transition:width 0.4s}
.chart-bar-val{font-size:10px;font-weight:700;color:#1A1A1A;width:52px;text-align:right;flex-shrink:0}
/* 설정 */
.setting-label{font-size:10px;font-weight:700;color:#A8A8A8;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.setting-inp{width:100%;padding:10px 12px;border:1px solid #E4E0DA;font-size:12px;font-family:inherit;outline:none;background:#fff;margin-bottom:6px;-webkit-appearance:none}
.setting-inp:focus{border-color:#1A1A1A}
.setting-btn{width:100%;padding:11px;background:#1A1A1A;color:#fff;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:2px}
.setting-btn.sec{background:#fff;color:#1A1A1A;border:1px solid #E4E0DA}
.staff-add-wrap{display:flex;gap:5px}
.staff-add-inp{flex:1;padding:9px 11px;border:1px solid #E4E0DA;font-size:12px;font-family:inherit;outline:none;background:#fff}
.staff-add-btn{padding:9px 13px;background:#1A1A1A;color:#fff;border:none;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
/* 토스트 */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(8px);background:#1A1A1A;color:#fff;padding:8px 16px;font-size:12px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:all 0.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 단계 색상 */
.s-상담{background:#fff7f4;color:#D4622A}
.s-계약금{background:#f0fdf4;color:#16a34a}
.s-실측{background:#f0f9ff;color:#0ea5e9}
.s-잔금{background:#fffbeb;color:#b45309}
.s-시공{background:#f5f5f5;color:#444}
.s-완료{background:#f0f0f0;color:#A8A8A8}
/* 권한 */
body.role-staff .master-only{display:none!important}
/* 상세 모달 — bottom-sheet 방식 */
.modal-box{
  width:100%;max-height:88vh;background:#fff;
  border-radius:14px 14px 0 0;
  overflow-y:auto;
  transform:translateY(20px);
  transition:transform 0.25s ease;
  padding-bottom:env(safe-area-inset-bottom,24px)
}
.overlay.open .modal-box{transform:translateY(0)}
.modal-top-bar{width:32px;height:3px;background:#E4E0DA;border-radius:2px;margin:12px auto 0}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-screen" id="login-screen">
  <div class="login-brand-text">DRAWING AT HOME</div>
  <div class="login-card">
    <div class="login-title">로그인</div>
    <div class="login-sub">계정을 선택해주세요</div>
    <button class="user-btn master" id="btn-master-login">
      <span class="user-btn-icon">👑</span>
      <div>
        <span class="user-btn-name">마스터</span>
        <span class="user-btn-desc">전체 현황 + 관리 기능</span>
      </div>
    </button>
    <div class="master-pw-wrap" id="master-pw-wrap" style="display:none">
      <input id="master-pw-input" type="password" placeholder="비밀번호 입력" autocomplete="off">
      <button id="btn-master-confirm">확인</button>
      <div class="master-pw-error" id="master-pw-error">비밀번호가 틀렸습니다</div>
    </div>
    <div id="staff-login-list"></div>
  </div>
  </div>
</div>

<div style="max-width:640px;margin:0 auto">
  <div class="hd">
    <span class="hd-logo">DRAWING at HOME</span>
    <div class="hd-right">
      <span id="current-user-badge"></span>
      <button class="hd-btn backup-btn" id="btn-backup">백업</button>
      <button class="hd-btn new-btn" id="btn-add-customer">+고객</button>
      <button class="hd-btn switch-btn" onclick="openEstimate(null)">견적서</button>
      <button class="hd-btn" id="btn-logout" style="background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15)!important">로그아웃</button>
    </div>
  </div>
  </div>
</div>
<div class="tabs">
  <button class="tab on" data-tab="home">홈</button>
  <button class="tab" data-tab="pipe">진행현황</button>
  <button class="tab" data-tab="search">고객목록</button>
  <button class="tab" data-tab="cal">일정</button>
  <button class="tab" data-tab="chart">매출</button>
  <button class="tab" data-tab="settings">설정</button>
</div>

<div id="home" class="wrap"></div>
<div id="pipe" style="display:none" class="wrap">
  <div style="margin-bottom:10px"><input type="search" id="pipe-search" placeholder="🔍 고객명 검색"></div>
  <div id="pipe-list"></div>
</div>
<div id="search" style="display:none" class="wrap">
  <div style="margin-bottom:10px"><input type="search" id="cust-search" placeholder="🔍 고객명 / 연락처 / 주소 검색"></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="sec" style="margin-bottom:0">전체 고객</div>
      <span id="search-count" style="font-size:11px;color:#A8A8A8"></span>
    </div>
    <div id="search-list"></div>
  </div>
</div>
<div id="cal" style="display:none" class="wrap">
  <div class="card"><div class="sec" id="cal-label">일정</div><div id="cal-list"></div></div>
</div>

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmt(n) { return (Number(n) || 0).toLocaleString() + '원'; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function thisMonthStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function daysDiff(dateStr) { return Math.floor((new Date() - new Date(dateStr)) / 86400000); }
function fmtPhone(v) {
  var d = v.replace(/[^0-9]/g, '');
  if (d.slice(0,2) === '02') {
    if (d.length <= 6) return d.slice(0,2) + '-' + d.slice(2);
    if (d.length <= 9) return d.slice(0,2) + '-' + d.slice(2,5) + '-' + d.slice(5);
    return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
  }
  if (d.length <= 7) return d.slice(0,3) + '-' + d.slice(3);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7,11);
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(function() { t.style.opacity = '0'; }, 2500);
}

var SUPABASE_URL = 'https://sradnglutbzbyyunjyah.supabase.co';
var SUPABASE_KEY = 'sb_publishable_9nYjQBzwiyausr7-Cd-elw_S9inJlge';

function sbXHR(method, path, data, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, SUPABASE_URL + '/rest/v1/' + path, true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Prefer', method === 'POST' ? 'return=representation' : 'return=minimal');
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      var result = null;
      try { result = xhr.responseText ? JSON.parse(xhr.responseText) : []; } catch(e) { result = []; }
      callback(null, result);
    } else { callback({status: xhr.status, text: xhr.responseText}, null); }
  };
  xhr.onerror = function() { callback({status: 0, text: 'network error'}, null); };
  xhr.send(data ? JSON.stringify(data) : null);
}

var _customerCache = [];

function dbRowToCustomer(row) {
  return { id:row.id, clientName:row.client_name||'', phone:row.phone||'', addr:row.addr||'', space:row.space||'', price:Number(row.price)||0, performanceRevenue:Number(row.performance_revenue)||0, staffName:row.staff_name||'마스터', stage:row.stage||'상담', date:row.date||'', memo:row.memo||'', visitCount:Number(row.visit_count)||1, createdAt:row.created_at||new Date().toISOString() };
}

function customerToDbRow(c) {
  return { client_name:c.clientName||'', phone:c.phone||'', addr:c.addr||'', space:c.space||'', price:Number(c.price)||0, performance_revenue:Number(c.performanceRevenue)||0, staff_name:c.staffName||'마스터', stage:c.stage||'상담', date:c.date||'', memo:c.memo||'', visit_count:Number(c.visitCount)||1 };
}

function loadCustomers() {
  if (_customerCache.length > 0) return _customerCache;
  try { return JSON.parse(localStorage.getItem('dah_customers') || '[]'); } catch(e) { return []; }
}

function loadCustomersAsync(callback) {
  sbXHR('GET', 'customers?select=*&order=created_at.desc', null, function(err, data) {
    if (err) { try { _customerCache = JSON.parse(localStorage.getItem('dah_customers') || '[]'); } catch(e) {} }
    else { _customerCache = (data || []).map(dbRowToCustomer); try { localStorage.setItem('dah_customers', JSON.stringify(_customerCache)); } catch(e) {} }
    if (callback) callback();
  });
}

function saveCustomers(arr) { _customerCache = arr; try { localStorage.setItem('dah_customers', JSON.stringify(arr)); } catch(e) {} }

function saveCustomerToDb(customer, callback) {
  var row = customerToDbRow(customer);
  if (customer.id) {
    sbXHR('PATCH', 'customers?id=eq.' + customer.id, row, function(err, data) { if(err) console.error('수정 오류:', err.text); if(callback) callback(err, data); });
  } else {
    sbXHR('POST', 'customers', row, function(err, data) { if(err) console.error('추가 오류:', err.text); if(callback) callback(err, data); });
  }
}

function deleteCustomerFromDb(clientName, callback) {
  sbXHR('DELETE', 'customers?client_name=eq.' + encodeURIComponent(clientName), null, function(err, data) { if(err) console.error('삭제 오류:', err.text); if(callback) callback(err, data); });
}

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === 'style') e.style.cssText = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  if (children) children.forEach(function(c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function div(style, children) { return el('div', {style: style}, children); }
function span(style, text) { return el('span', {style: style, text: text}); }
function btn(style, text, onClick) { var b = el('button', {style: style, text: text}); b.addEventListener('click', onClick); return b; }

function goTab(t) {
  ['home','pipe','search','cal','chart','settings'].forEach(function(id) { document.getElementById(id).style.display = id === t ? 'block' : 'none'; });
  document.querySelectorAll('.tab').forEach(function(b) { b.className = b.getAttribute('data-tab') === t ? 'tab on' : 'tab'; });
  if (t === 'home') loadCustomersAsync(renderHome);
  if (t === 'pipe') loadCustomersAsync(renderPipe);
  if (t === 'search') loadCustomersAsync(renderSearch);
  if (t === 'cal') loadCustomersAsync(renderCal);
  if (t === 'settings') renderSettings();
  if (t === 'chart') loadCustomersAsync(function(){ renderChart(currentChartPeriod); });
}

function renderHome() {

  var customers = (currentUser && currentUser.role === 'staff')
    ? allCustomers.filter(function(c){ return (c.staffName||'마스터') === currentUser.name; })
    : allCustomers;
  var now = new Date();
  var mon = now.getFullYear() + '년 ' + (now.getMonth()+1) + '월';
  var month = thisMonthStr();
  var isMaster = currentUser && currentUser.role === 'master';
  var myName = currentUser ? currentUser.name : '마스터';

    var totalPerf = totalActive.reduce(function(s,c){ return s+(Number(c.performanceRevenue)||0); },0);
    var totalCon  = totalActive.length;
    var totalCons = allCustomers.filter(function(c){ return (c.date||'').slice(0,7)===month; }).length;

    staffCardInner.appendChild(staffLbl);
    allStaffs.forEach(function(staff) {
      var sc = allCustomers.filter(function(c){ return (c.staffName||'마스터')===staff&&(c.date||'').slice(0,7)===month&&c.stage!=='상담'; });
      var sv = sc.reduce(function(s,c){ return s+(Number(c.price)||0); },0);
      var sp = sc.reduce(function(s,c){ return s+(Number(c.performanceRevenue)||0); },0);
      var goalKey = 'dah_goal_'+staff;
      var sGoal = Number(localStorage.getItem(goalKey)||0);
      var sPct = sGoal>0 ? Math.min(Math.round(sp/sGoal*100),100) : 0;
      var row = el('div', {style:'padding:10px 0;border-bottom:1px solid #F0EDE8'});
      row.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(sGoal>0?'6':'0')+'px">'+
          '<span style="font-size:13px;font-weight:700;color:#1A1A1A">'+staff+'</span>'+
          '<div style="text-align:right">'+
            '<span style="font-size:13px;font-weight:700;color:#D4622A;display:block">'+fmt(sv)+'</span>'+
            '<span style="font-size:10px;color:#A8A8A8">성과 '+fmt(sp)+'</span>'+
          '</div>'+
        '</div>'+
        (sGoal>0
          ? '<div style="height:4px;background:#F0EDE8;overflow:hidden"><div style="height:4px;background:#D4622A;width:'+sPct+'%"></div></div>'+
            '<span style="font-size:10px;color:#A8A8A8;display:block;margin-top:3px">목표 '+sPct+'% ('+fmt(sGoal)+')</span>'

  } else {

var currentChartPeriod = 'daily';

function renderChart(period) {
  if (period) currentChartPeriod = period;
  var allChart = loadCustomers();
  var customers = (currentUser && currentUser.role === 'staff') ? allChart.filter(function(c) { return (c.staffName||'마스터') === currentUser.name; }) : allChart;
  var now = new Date();
  var barsEl = document.getElementById('chart-bars'); barsEl.innerHTML = '';
  var sumEl = document.getElementById('chart-summary'); sumEl.innerHTML = '';
  var periodLabel = document.getElementById('chart-period-label');
  var summaryLabel = document.getElementById('chart-summary-label');

  // 차트 탭 활성화
  document.querySelectorAll('.chart-tab').forEach(function(b) {
    var isOn = b.getAttribute('data-period') === currentChartPeriod;
    b.style.color = isOn ? '#D4622A' : '#A8A8A8';
    b.style.borderBottom = isOn ? '2px solid #D4622A' : 'none';
    b.style.fontWeight = isOn ? '700' : '400';
  });

  var periods = [], currentKey = '', labels = [];

  if (currentChartPeriod === 'daily') {
    // 최근 7일
    periodLabel.textContent = '일별 매출 (최근 7일)';
    summaryLabel.textContent = '오늘 요약';
    for (var i = 6; i >= 0; i--) {
      var d = new Date(now); d.setDate(d.getDate() - i);
      var key = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
      periods.push({key: key, label: (d.getMonth()+1)+'/'+d.getDate()});
    }
    currentKey = todayStr();
  } else if (currentChartPeriod === 'weekly') {
    // 최근 6주
    periodLabel.textContent = '주별 매출 (최근 6주)';
    summaryLabel.textContent = '이번 주 요약';
    for (var i = 5; i >= 0; i--) {
      var d = new Date(now); d.setDate(d.getDate() - (i * 7));
      var weekStart = new Date(d); weekStart.setDate(d.getDate() - d.getDay());
      var weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
      var key = weekStart.getFullYear()+'-'+pad2(weekStart.getMonth()+1)+'-'+pad2(weekStart.getDate());
      periods.push({key: key, endKey: weekEnd.getFullYear()+'-'+pad2(weekEnd.getMonth()+1)+'-'+pad2(weekEnd.getDate()), label: (weekStart.getMonth()+1)+'/'+weekStart.getDate()});
    }
    var thisWeekStart = new Date(now); thisWeekStart.setDate(now.getDate() - now.getDay());
    currentKey = thisWeekStart.getFullYear()+'-'+pad2(thisWeekStart.getMonth()+1)+'-'+pad2(thisWeekStart.getDate());
  } else if (currentChartPeriod === 'monthly') {
    // 최근 6개월
    periodLabel.textContent = '월별 매출 (최근 6개월)';
    summaryLabel.textContent = '이번 달 요약';
    for (var i = 5; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      periods.push({key: d.getFullYear()+'-'+pad2(d.getMonth()+1), label:(d.getMonth()+1)+'월'});
    }
    currentKey = thisMonthStr();
  } else if (currentChartPeriod === 'yearly') {
    // 최근 3년
    periodLabel.textContent = '연별 매출 (최근 3년)';
    summaryLabel.textContent = '올해 요약';
    for (var i = 2; i >= 0; i--) {
      var y = now.getFullYear() - i;
      periods.push({key: String(y), label: y+'년'});
    }
    currentKey = String(now.getFullYear());
  }

  // 매출 계산
  var revenues = periods.map(function(p) {
    return customers.filter(function(c) {
      if (!c.date || c.stage === '상담') return false;
      if (currentChartPeriod === 'daily') return c.date === p.key;
      if (currentChartPeriod === 'weekly') return c.date >= p.key && c.date <= p.endKey;
      if (currentChartPeriod === 'monthly') return c.date.slice(0,7) === p.key;
      if (currentChartPeriod === 'yearly') return c.date.slice(0,4) === p.key;
    }).reduce(function(s,c) { return s+(Number(c.price)||0); }, 0);
  });

  var maxRev = Math.max.apply(null, revenues) || 1;
  periods.forEach(function(p, i) {
    var isCurrent = p.key === currentKey;
    var h = Math.round(revenues[i]/maxRev*100);
    var col = div('flex:1;display:flex;flex-direction:column;align-items:center;gap:4px', [
      span('font-size:9px;color:'+(isCurrent?'#D4622A':'#A8A8A8')+';font-weight:'+(isCurrent?'700':'400'), revenues[i]>0?(revenues[i]/10000).toFixed(0)+'만':'0'),
      div('width:100%;background:'+(isCurrent?'#D4622A':'#E5E0D8')+';height:'+(h||2)+'px', []),
      span('font-size:10px;color:'+(isCurrent?'#D4622A':'#A8A8A8'), p.label)
    ]);
    barsEl.appendChild(col);
  });

  // 현재 기간 요약
  var currentCustomers = customers.filter(function(c) {
    if (!c.date) return false;
    if (currentChartPeriod === 'daily') return c.date === currentKey;
    if (currentChartPeriod === 'weekly') { var p = periods[periods.length-1]; return c.date >= p.key && c.date <= p.endKey; }
    if (currentChartPeriod === 'monthly') return c.date.slice(0,7) === currentKey;
    if (currentChartPeriod === 'yearly') return c.date.slice(0,4) === currentKey;
  });
  var curRev = currentCustomers.filter(function(c){return c.stage!=='상담';}).reduce(function(s,c){return s+(Number(c.price)||0);},0);
  var curPerf = currentCustomers.filter(function(c){return c.stage!=='상담';}).reduce(function(s,c){return s+(Number(c.performanceRevenue)||0);},0);
  var curCon = currentCustomers.filter(function(c){return c.stage!=='상담';}).length;
  var curCons = currentCustomers.length;
  var conv = curCons > 0 ? Math.round(curCon/curCons*100) : 0;

  [['전체 매출',fmt(curRev),'#D4622A'],['성과매출',fmt(curPerf),'#1A1A1A'],['상담 건수',curCons+'건','#1A1A1A'],['계약 건수',curCon+'건','#1A1A1A'],['전환율',conv+'%','#1A1A1A']].forEach(function(row) {
    sumEl.appendChild(div('display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #E5E0D8', [span('font-size:13px;color:#6B6B6B', row[0]), span('font-size:13px;font-weight:700;color:'+row[2], row[1])]));
  });
}

function changeStage(stage) {
  if (currentUser && currentUser.role === 'staff') {
    var arr0 = loadCustomers(); var c0 = arr0.find(function(x) { return x.clientName === currentDetailName; });

  }

function saveCustomer() {

  if (!name || !phone) { alert('이름과 연락처는 필수입니다.'); return; }
  var arr = loadCustomers();
  if (editingCustomerName) {
    arr = arr.map(function(c) {
      if (c.clientName === editingCustomerName) {
        var staffName2; if (currentUser && currentUser.role === 'staff') { staffName2 = currentUser.name; } else { var asb2 = document.querySelector('.staff-btn.active'); staffName2 = asb2 ? asb2.getAttribute('data-staff') : (c.staffName||'마스터'); }
        return { clientName:name, phone:phone, addr:document.getElementById('add-addr').value.trim(), space:document.getElementById('add-space').value.trim(), price:c.price||0, performanceRevenue:c.performanceRevenue||0, staffName:staffName2, stage:document.getElementById('add-stage').value, date:document.getElementById('add-date').value, memo:document.getElementById('add-memo').value.trim(), visitCount:c.visitCount||1, createdAt:c.createdAt||new Date().toISOString() };
      } return c;
    });

  } else {

    var visitCount = existing ? (existing.visitCount||1)+1 : 1;
    if (existing) arr = arr.filter(function(c) { return c.clientName !== name; });
    var staffName; if (currentUser && currentUser.role === 'staff') { staffName = currentUser.name; } else { var asb = document.querySelector('.staff-btn.active'); staffName = asb ? asb.getAttribute('data-staff') : '마스터'; }
    var newCustomer = { clientName:name, phone:phone, addr:document.getElementById('add-addr').value.trim(), space:document.getElementById('add-space').value.trim(), price:0, performanceRevenue:0, staffName:staffName, stage:document.getElementById('add-stage').value, date:document.getElementById('add-date').value, memo:document.getElementById('add-memo').value.trim(), visitCount:visitCount, createdAt:new Date().toISOString() };

      });
    })(goalKey, staff);
    gRow.appendChild(gInput);
    goalCard.appendChild(gRow);
  });
  wrap.appendChild(goalCard);

  // Make.com 웹훅 URL
  var webhookCard = div('background:#fff;margin-bottom:10px;padding:16px', [
    span('font-size:11px;font-weight:700;color:#A8A8A8;letter-spacing:1.2px;display:block;margin-bottom:4px', '⚙️ Make.com 웹훅 URL'),
    span('font-size:11px;color:#A8A8A8;display:block;margin-bottom:10px', '알림톡 자동 발송 연동 (검수 완료 후 입력)')
  ]);
  var curWebhook = localStorage.getItem('dah_webhook_url') || '';
  var webhookInput = el('input', {type:'text', placeholder:'https://hook.make.com/...', value:curWebhook, style:'width:100%;padding:9px 10px;border:1px solid #E5E0D8;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:8px'});
  webhookCard.appendChild(webhookInput);
  webhookCard.appendChild(btn('width:100%;padding:10px;background:#1A1A1A;color:#fff;border:none;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer', '저장', function() {
    var url = webhookInput.value.trim();
    try { localStorage.setItem('dah_webhook_url', url); } catch(e){}
    showToast('웹훅 URL이 저장됐습니다');
  }));
  wrap.appendChild(webhookCard);

  // 데이터 백업/복원
  var dataCard = div('background:#fff;margin-bottom:10px;padding:16px', [
    span('font-size:11px;font-weight:700;color:#A8A8A8;letter-spacing:1.2px;display:block;margin-bottom:12px', '💾 데이터 관리')
  ]);
  dataCard.appendChild(btn('width:100%;padding:11px;background:#fff;border:1px solid #E5E0D8;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px', '💾 백업 (JSON 다운로드)', backupData));
  var restoreInput = el('input', {type:'file', accept:'.json', style:'display:none', id:'restore-input'});
  restoreInput.addEventListener('change', function(e) {
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if(data.customers) {
          saveCustomers(data.customers);
          showToast('복원 완료! ' + data.customers.length + '건');
          renderHome();
        }
      } catch(err) { alert('파일 형식이 올바르지 않습니다'); }
    };
    reader.readAsText(file);
  });
  dataCard.appendChild(restoreInput);
  dataCard.appendChild(btn('width:100%;padding:11px;background:#fff;border:1px solid #E5E0D8;font-size:13px;font-family:inherit;cursor:pointer', '📂 복원 (JSON 업로드)', function() { document.getElementById('restore-input').click(); }));
  wrap.appendChild(dataCard);
}

// ── 시공 이력 조회 ──────────────────────────────
function loadEstimates(customerName, callback) {
  sbXHR('GET', 'estimates?customer_name=eq.' + encodeURIComponent(customerName) + '&order=created_at.desc', null, function(err, data) {
    if (err) { callback([]); return; }
    callback(data || []);
  });
}

function showEstimateHistory(customerName) {
  loadEstimates(customerName, function(estimates) {
    var body = document.getElementById('detail-body');
    var histSection = document.getElementById('estimate-history-section');
    if (histSection) histSection.remove();

    var section = el('div', {id:'estimate-history-section', style:'margin-top:14px'});
    section.appendChild(span('font-size:11px;color:#A8A8A8;letter-spacing:1.2px;display:block;margin-bottom:8px', '📋 시공 이력 (' + estimates.length + '건)'));

    if (estimates.length === 0) {
      section.appendChild(span('font-size:13px;color:#A8A8A8;display:block;text-align:center;padding:12px 0', '시공 이력이 없습니다'));
    } else {
      estimates.forEach(function(e) {
        var row = div('padding:10px;border:1px solid #E5E0D8;margin-bottom:6px;background:#F9F9F9', [
          div('display:flex;justify-content:space-between;margin-bottom:4px', [
            span('font-size:12px;font-weight:700', e.space || '—'),
            span('font-size:12px;color:#D4622A;font-weight:700', (Number(e.price)||0).toLocaleString()+'원')
          ]),
          e.product ? span('font-size:11px;color:#6B6B6B;display:block', '제품: ' + e.product) : null,
          e.fabric ? span('font-size:11px;color:#6B6B6B;display:block', '원단: ' + e.fabric) : null,
          (e.width && e.height) ? span('font-size:11px;color:#6B6B6B;display:block', '사이즈: ' + e.width + ' × ' + e.height + 'cm') : null,
          span('font-size:10px;color:#A8A8A8;display:block;margin-top:4px', (e.date||'') + ' · ' + (e.stage||'') + ' · ' + (e.staff_name||''))
        ]);
        section.appendChild(row);
      });
    }
    body.appendChild(section);
  });
}

// ── 이벤트 바인딩 ──────────────────────────
document.querySelectorAll('.tab').forEach(function(b) { b.addEventListener('click', function() { goTab(b.getAttribute('data-tab')); }); });
document.querySelectorAll('.chart-tab').forEach(function(b) { b.addEventListener('click', function() { renderChart(b.getAttribute('data-period')); }); });
document.getElementById('btn-add-customer').addEventListener('click', function() { openAdd(null); });
document.getElementById('btn-backup').addEventListener('click', backupData);
document.getElementById('btn-logout').addEventListener('click', logout);
document.getElementById('btn-master-login').addEventListener('click', function() { var wrap = document.getElementById('master-pw-wrap'); wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none'; if (wrap.style.display === 'block') { document.getElementById('master-pw-input').value = ''; document.getElementById('master-pw-error').style.display = 'none'; document.getElementById('master-pw-input').focus(); } });
document.getElementById('btn-master-confirm').addEventListener('click', function() { var pw = document.getElementById('master-pw-input').value; if (pw === MASTER_PW) { document.getElementById('master-pw-wrap').style.display = 'none'; loginAs('master'); } else { document.getElementById('master-pw-error').style.display = 'block'; document.getElementById('master-pw-input').value = ''; document.getElementById('master-pw-input').focus(); } });
document.getElementById('master-pw-input').addEventListener('keydown', function(e) { if (e.keyCode === 13) document.getElementById('btn-master-confirm').click(); });
document.getElementById('add-close-btn').addEventListener('click', closeAdd);
document.getElementById('detail-close-btn').addEventListener('click', closeDetail);
document.getElementById('add-save-btn').addEventListener('click', saveCustomer);
document.getElementById('add-phone').addEventListener('input', function() { this.value = fmtPhone(this.value); });
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('staff-btn')) {
    document.querySelectorAll('.staff-btn').forEach(function(b) { b.classList.remove('active'); b.style.background = '#fff'; b.style.color = '#6B6B6B'; b.style.border = '1px solid #E5E0D8'; b.style.fontWeight = '400'; });
    e.target.classList.add('active'); e.target.style.background = '#D4622A'; e.target.style.color = '#fff'; e.target.style.border = '1px solid #D4622A'; e.target.style.fontWeight = '700';
  }
});
document.getElementById('pipe-search').addEventListener('input', renderPipe);
document.getElementById('cust-search').addEventListener('input', renderSearch);
document.getElementById('detail-overlay').addEventListener('click', function(e) { if (e.target === this) closeDetail(); });
document.getElementById('add-overlay').addEventListener('click', function(e) { if (e.target === this) closeAdd(); });

// ── 초기화 ──────────────────────────────────
(function() {
  try {
    var saved = JSON.parse(localStorage.getItem('dah_session') || 'null');
    if (saved && saved.name && saved.role) {
      var validStaffs = ['마스터'].concat(getStaffList());
      if (validStaffs.indexOf(saved.name) >= 0) {
        currentUser = saved;
        var loginScreen = document.getElementById('login-screen'); if (loginScreen) loginScreen.style.display = 'none';
        var badge = document.getElementById('current-user-badge'); if (badge) badge.textContent = currentUser.name;
        applyPermissions(); loadCustomersAsync(renderHome); return;
      }
    }
  } catch(e) {}
  renderStaffLoginList();
})();
</script>
