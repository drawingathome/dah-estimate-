<script>
var STAGES = ['상담','계약금','실측','잔금','시공','완료'];
var STAGE_COLORS = {상담:'#D4622A',계약금:'#16a34a',실측:'#0ea5e9',잔금:'#b45309',시공:'#1A1A1A',완료:'#A8A8A8'};
var STAGE_BG = {상담:'#fff7f4',계약금:'#f0fdf4',실측:'#f0f9ff',잔금:'#fffbeb',시공:'#f5f5f5',완료:'#f9f9f9'};
var currentDetailName = null;

var MASTER_PW = (function(){ try{ return localStorage.getItem('dah_master_pw')||'dah2012'; }catch(e){ return 'dah2012'; } })();
var currentUser = null;

function getStaffList() {
  try { var list = JSON.parse(localStorage.getItem('dah_staff_list') || '[]'); return list.length > 0 ? list : []; } catch(e) { return []; }
}

function loginAs(who) {
  if (who === 'master') { currentUser = {name:'마스터', role:'master'}; }
  else { currentUser = {name:who, role:'staff'}; }
  try { localStorage.setItem('dah_session', JSON.stringify(currentUser)); } catch(e){}
  var loginScreen = document.getElementById('login-screen');
  if (loginScreen) loginScreen.style.display = 'none';
  var badge = document.getElementById('current-user-badge');
  if (badge) badge.textContent = currentUser.name;
  applyPermissions();
  loadCustomersAsync(renderHome);
}

function applyPermissions() {
  var isMaster = currentUser && currentUser.role === 'master';
  var backupBtn = document.getElementById('btn-backup');
  if (backupBtn) backupBtn.style.display = isMaster ? '' : 'none';
}

function logout() {
  currentUser = null;
  try { localStorage.removeItem('dah_session'); } catch(e){}
  var ls = document.getElementById('login-screen');
  if(ls) ls.style.display = 'flex';
  var pw = document.getElementById('master-pw-wrap');
  if(pw) pw.style.display = 'none';
  renderStaffLoginList();
}

function changeMasterPassword() {
  var cur = document.getElementById('change-pw-current');
  var nw = document.getElementById('change-pw-new');
  var con = document.getElementById('change-pw-confirm');
  if(!cur||!nw||!con) return;
  if(cur.value !== MASTER_PW) { alert('현재 비밀번호가 틀렸습니다.'); cur.value=''; return; }
  if(nw.value.length < 4) { alert('새 비밀번호는 4자 이상이어야 합니다.'); return; }
  if(nw.value !== con.value) { alert('새 비밀번호가 일치하지 않습니다.'); con.value=''; return; }
  MASTER_PW = nw.value;
  try { localStorage.setItem('dah_master_pw', MASTER_PW); } catch(e){}
  cur.value=''; nw.value=''; con.value='';
  showToast('비밀번호가 변경됐습니다');
  var wrap = document.getElementById('pw-change-wrap');
  if(wrap) wrap.style.display = 'none';
}

function renderStaffLoginList() {
  var list = getStaffList();
  var el2 = document.getElementById('staff-login-list');
  if (!el2) return;
  el2.innerHTML = '';
  list.forEach(function(name) {
    var b = document.createElement('button');
    b.className = 'user-btn';
    b.innerHTML = '<span style="font-size:18px">👤</span><div><div style="font-weight:700;font-size:14px">'+name+'</div><div style="font-size:11px;color:#A8A8A8">본인 실적만 보기</div></div>';
    b.addEventListener('click', function() { loginAs(name); });
    el2.appendChild(b);
  });
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmt(n) { return (Number(n) || 0).toLocaleString() + '원'; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function thisMonthStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function daysDiff(dateStr) { return Math.floor((new Date() - new Date(dateStr)) / 86400000); }
function fmtPhone(v) {
  var d = v.replace(/[^0-9]/g, '');
  if (d.slice(0,2) === '02') {
    if (d.length <= 6) return d.slice(0,2) + '-' + d.slice(2);
    if (d.length <= 9) return d.slice(0,2) + '-' + d.slice(2,5) + '-' + d.slice(5);
    return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
  }
  if (d.length <= 7) return d.slice(0,3) + '-' + d.slice(3);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7,11);
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(function() { t.style.opacity = '0'; }, 2500);
}

var SUPABASE_URL = 'https://sradnglutbzbyyunjyah.supabase.co';
var SUPABASE_KEY = 'sb_publishable_9nYjQBzwiyausr7-Cd-elw_S9inJlge';

function sbXHR(method, path, data, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, SUPABASE_URL + '/rest/v1/' + path, true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Prefer', method === 'POST' ? 'return=representation' : 'return=minimal');
  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      var result = null;
      try { result = xhr.responseText ? JSON.parse(xhr.responseText) : []; } catch(e) { result = []; }
      callback(null, result);
    } else { callback({status: xhr.status, text: xhr.responseText}, null); }
  };
  xhr.onerror = function() { callback({status: 0, text: 'network error'}, null); };
  xhr.send(data ? JSON.stringify(data) : null);
}

var _customerCache = [];

function dbRowToCustomer(row) {
  return { id:row.id, clientName:row.client_name||'', phone:row.phone||'', addr:row.addr||'', space:row.space||'', price:Number(row.price)||0, performanceRevenue:Number(row.performance_revenue)||0, staffName:row.staff_name||'마스터', stage:row.stage||'상담', date:row.date||'', memo:row.memo||'', visitCount:Number(row.visit_count)||1, createdAt:row.created_at||new Date().toISOString() };
}

function customerToDbRow(c) {
  return { client_name:c.clientName||'', phone:c.phone||'', addr:c.addr||'', space:c.space||'', price:Number(c.price)||0, performance_revenue:Number(c.performanceRevenue)||0, staff_name:c.staffName||'마스터', stage:c.stage||'상담', date:c.date||'', memo:c.memo||'', visit_count:Number(c.visitCount)||1 };
}

function loadCustomers() {
  if (_customerCache.length > 0) return _customerCache;
  try { return JSON.parse(localStorage.getItem('dah_customers') || '[]'); } catch(e) { return []; }
}

function loadCustomersAsync(callback) {
  sbXHR('GET', 'customers?select=*&order=created_at.desc', null, function(err, data) {
    if (err) { try { _customerCache = JSON.parse(localStorage.getItem('dah_customers') || '[]'); } catch(e) {} }
    else { _customerCache = (data || []).map(dbRowToCustomer); try { localStorage.setItem('dah_customers', JSON.stringify(_customerCache)); } catch(e) {} }
    if (callback) callback();
  });
}

function saveCustomers(arr) { _customerCache = arr; try { localStorage.setItem('dah_customers', JSON.stringify(arr)); } catch(e) {} }

function saveCustomerToDb(customer, callback) {
  var row = customerToDbRow(customer);
  if (customer.id) {
    sbXHR('PATCH', 'customers?id=eq.' + customer.id, row, function(err, data) { if(err) console.error('수정 오류:', err.text); if(callback) callback(err, data); });
  } else {
    sbXHR('POST', 'customers', row, function(err, data) { if(err) console.error('추가 오류:', err.text); if(callback) callback(err, data); });
  }
}

function deleteCustomerFromDb(clientName, callback) {
  sbXHR('DELETE', 'customers?client_name=eq.' + encodeURIComponent(clientName), null, function(err, data) { if(err) console.error('삭제 오류:', err.text); if(callback) callback(err, data); });
}

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === 'style') e.style.cssText = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  if (children) children.forEach(function(c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function div(style, children) { return el('div', {style: style}, children); }
function span(style, text) { return el('span', {style: style, text: text}); }
function btn(style, text, onClick) { var b = el('button', {style: style, text: text}); b.addEventListener('click', onClick); return b; }

function goTab(t) {
  ['home','pipe','search','cal','chart'].forEach(function(id) { document.getElementById(id).style.display = id === t ? 'block' : 'none'; });
  document.querySelectorAll('.tab').forEach(function(b) { b.className = b.getAttribute('data-tab') === t ? 'tab on' : 'tab'; });
  if (t === 'home') loadCustomersAsync(renderHome);
  if (t === 'pipe') loadCustomersAsync(renderPipe);
  if (t === 'search') loadCustomersAsync(renderSearch);
  if (t === 'cal') loadCustomersAsync(renderCal);
  if (t === 'chart') loadCustomersAsync(renderChart);
}

function renderHome() {
  var wrap = document.getElementById('home');
  wrap.innerHTML = '';
  var allCustomers = loadCustomers();
  var customers = (currentUser && currentUser.role === 'staff') ? allCustomers.filter(function(c) { return (c.staffName||'마스터') === currentUser.name; }) : allCustomers;
  var now = new Date();
  var mon = now.getFullYear() + '년 ' + (now.getMonth()+1) + '월';
  var month = thisMonthStr();
  var isMaster = currentUser && currentUser.role === 'master';

function closeDetail() { document.getElementById('detail-overlay').className = 'overlay'; currentDetailName = null; }

function changeStage(stage) {
  if (currentUser && currentUser.role === 'staff') {
    var arr0 = loadCustomers(); var c0 = arr0.find(function(x) { return x.clientName === currentDetailName; });
    if (c0 && (c0.staffName||'마스터') !== currentUser.name) { alert('본인 담당 고객만 단계를 변경할 수 있습니다.'); return; }
  }

  renderHome(); openDetail(currentDetailName);

}

function deleteCustomer() {
  if (!confirm((currentDetailName||'고객') + '을(를) 삭제할까요?')) return;
  deleteCustomerFromDb(currentDetailName, function() { loadCustomersAsync(renderHome); });
  saveCustomers(loadCustomers().filter(function(c) { return c.clientName !== currentDetailName; }));
  closeDetail(); renderHome();
}

var editingCustomerName = null;

    if (c) { document.getElementById('add-name').value = c.clientName; document.getElementById('add-phone').value = c.phone || ''; document.getElementById('add-addr').value = c.addr || ''; document.getElementById('add-space').value = c.space || ''; document.getElementById('add-stage').value = c.stage || '상담'; document.getElementById('add-date').value = c.date || todayStr(); document.getElementById('add-memo').value = c.memo || ''; }
  } else { document.getElementById('add-name').value = ''; document.getElementById('add-phone').value = ''; document.getElementById('add-addr').value = ''; document.getElementById('add-space').value = ''; document.getElementById('add-stage').value = '상담'; document.getElementById('add-date').value = todayStr(); document.getElementById('add-memo').value = ''; }

  var isStaffUser = currentUser && currentUser.role === 'staff';

  });

function closeAdd() { document.getElementById('add-overlay').className = 'overlay'; }

function saveCustomer() {
  var name = document.getElementById('add-name').value.trim();
  var phone = document.getElementById('add-phone').value.trim();
  if (!name || !phone) { alert('이름과 연락처는 필수입니다.'); return; }
  var arr = loadCustomers();
  if (editingCustomerName) {
    arr = arr.map(function(c) {
      if (c.clientName === editingCustomerName) {
        var staffName2; if (currentUser && currentUser.role === 'staff') { staffName2 = currentUser.name; } else { var asb2 = document.querySelector('.staff-btn.active'); staffName2 = asb2 ? asb2.getAttribute('data-staff') : (c.staffName||'마스터'); }
        return { clientName:name, phone:phone, addr:document.getElementById('add-addr').value.trim(), space:document.getElementById('add-space').value.trim(), price:c.price||0, performanceRevenue:c.performanceRevenue||0, staffName:staffName2, stage:document.getElementById('add-stage').value, date:document.getElementById('add-date').value, memo:document.getElementById('add-memo').value.trim(), visitCount:c.visitCount||1, createdAt:c.createdAt||new Date().toISOString() };
      } return c;
    });
    saveCustomers(arr); closeAdd(); renderHome(); openDetail(name); showToast('고객 정보가 수정됐습니다');
  } else {
    var existing = arr.find(function(c) { return c.clientName === name; });
    if (existing) { if (!confirm('"' + name + '" 고객이 이미 있습니다.\n재구매 고객으로 업데이트할까요?')) return; }
    var visitCount = existing ? (existing.visitCount||1)+1 : 1;
    if (existing) arr = arr.filter(function(c) { return c.clientName !== name; });
    var staffName; if (currentUser && currentUser.role === 'staff') { staffName = currentUser.name; } else { var asb = document.querySelector('.staff-btn.active'); staffName = asb ? asb.getAttribute('data-staff') : '마스터'; }
    var newCustomer = { clientName:name, phone:phone, addr:document.getElementById('add-addr').value.trim(), space:document.getElementById('add-space').value.trim(), price:0, performanceRevenue:0, staffName:staffName, stage:document.getElementById('add-stage').value, date:document.getElementById('add-date').value, memo:document.getElementById('add-memo').value.trim(), visitCount:visitCount, createdAt:new Date().toISOString() };
    arr.unshift(newCustomer); saveCustomers(arr);
    saveCustomerToDb(newCustomer, function(err, data) { if(!err && data && data[0]) { newCustomer.id = data[0].id; saveCustomers(arr); } });
    closeAdd(); renderHome(); openDetail(name);
    showToast('고객이 추가됐습니다');
  }
}

document.getElementById('btn-backup').addEventListener('click', backupData);
document.getElementById('btn-logout').addEventListener('click', logout);
document.getElementById('btn-master-login').addEventListener('click', function() { var wrap = document.getElementById('master-pw-wrap'); wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none'; if (wrap.style.display === 'block') { document.getElementById('master-pw-input').value = ''; document.getElementById('master-pw-error').style.display = 'none'; document.getElementById('master-pw-input').focus(); } });
document.getElementById('btn-master-confirm').addEventListener('click', function() { var pw = document.getElementById('master-pw-input').value; if (pw === MASTER_PW) { document.getElementById('master-pw-wrap').style.display = 'none'; loginAs('master'); } else { document.getElementById('master-pw-error').style.display = 'block'; document.getElementById('master-pw-input').value = ''; document.getElementById('master-pw-input').focus(); } });
document.getElementById('master-pw-input').addEventListener('keydown', function(e) { if (e.keyCode === 13) document.getElementById('btn-master-confirm').click(); });
document.getElementById('add-close-btn').addEventListener('click', closeAdd);
document.getElementById('detail-close-btn').addEventListener('click', closeDetail);
document.getElementById('add-save-btn').addEventListener('click', saveCustomer);
document.getElementById('add-phone').addEventListener('input', function() { this.value = fmtPhone(this.value); });
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('staff-btn')) {
    document.querySelectorAll('.staff-btn').forEach(function(b) { b.classList.remove('active'); b.style.background = '#fff'; b.style.color = '#6B6B6B'; b.style.border = '1px solid #E5E0D8'; b.style.fontWeight = '400'; });
    e.target.classList.add('active'); e.target.style.background = '#D4622A'; e.target.style.color = '#fff'; e.target.style.border = '1px solid #D4622A'; e.target.style.fontWeight = '700';
  }
});
document.getElementById('pipe-search').addEventListener('input', renderPipe);
document.getElementById('cust-search').addEventListener('input', renderSearch);
document.getElementById('detail-overlay').addEventListener('click', function(e) { if (e.target === this) closeDetail(); });
document.getElementById('add-overlay').addEventListener('click', function(e) { if (e.target === this) closeAdd(); });

// ── 초기화 ──────────────────────────────────
(function() {
  try {
    var saved = JSON.parse(localStorage.getItem('dah_session') || 'null');
    if (saved && saved.name && saved.role) {
      var validStaffs = ['마스터'].concat(getStaffList());
      if (validStaffs.indexOf(saved.name) >= 0) {
        currentUser = saved;
        var loginScreen = document.getElementById('login-screen'); if (loginScreen) loginScreen.style.display = 'none';
        var badge = document.getElementById('current-user-badge'); if (badge) badge.textContent = currentUser.name;
        applyPermissions(); loadCustomersAsync(renderHome); return;
      }
    }
  } catch(e) {}
  renderStaffLoginList();
})();
</script>
</body>
