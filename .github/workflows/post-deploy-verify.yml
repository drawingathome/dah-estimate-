name: Post-deploy verify (production)

# 2026-10-05: 배포(Deploy to Vercel)가 끝나면 "운영에 실제로 올라간 화면"을 자동으로 열어 검증한다.
# 운영 데이터는 건드리지 않음(백엔드는 가짜로 대체). 실패하면 이 워크플로우가 빨간불이 됨.
on:
  workflow_run:
    workflows: ["Deploy to Vercel"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 2026-10-27(H-7, F-9 재발: 이 설치 단계가 25분 제한까지 멈춰 취소된 일이 2번 있었음): 단계마다 시간 제한을 두고,
      # 설치는 한 번 멈추면 끊고 한 번 더 시도하며, 진행 상황이 로그에 보이게 한다(멈춘 지점을 알 수 있게).
      - name: Playwright 설치(크롬 + 사파리 엔진)
        timeout-minutes: 12
        run: |
          set -x
          mkdir -p ci-logs
          {
            echo "playwright 설치 시작 $(date -u +%FT%TZ)"; node -v; npm -v
            npm install --no-save playwright@latest
            node -p "'playwright ' + require('playwright/package.json').version"
            for i in 1 2; do
              if DEBUG=pw:install timeout 300 npx playwright install --with-deps chromium webkit; then echo "설치 성공(시도 $i)"; break; fi
              echo "설치 시도 $i 실패 또는 5분 초과 — 재시도 $(date -u +%FT%TZ)"; [ "$i" = 2 ] && exit 1
            done
          } 2>&1 | tee ci-logs/install.log
          exit ${PIPESTATUS[0]}
      # H-31: 설치가 실패하면 로그를 파일로 올려 Claude가 직접 읽을 수 있게 한다(H-25와 같은 방식).
      - name: 설치 로그 저장(실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-verify-install
          path: ci-logs/
          retention-days: 14
      - name: 운영 배포 검증
        timeout-minutes: 14
        run: node scripts/post-deploy-verify.js
        env:
          BASE_URLS: https://dah-dashboard.vercel.app,https://dah-estimate.vercel.app
          VERIFY_WAIT_MIN: "8"
