name: Deploy Staging (GitHub Pages)

on:
  push:
    branches: [dev]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 절대경로를 상대경로로 치환 (GitHub Pages 하위경로 대응)
        run: |
          find . -maxdepth 1 -name "*.html" -exec sed -i -E 's/(src|href)="\/([^\/"][^"]*)"/\1=".\/\2"/g' {} \;

      - name: manifest.json 절대경로도 상대경로로 치환 (PWA 아이콘 깨짐 방지)
        run: |
          if [ -f manifest.json ]; then
            sed -i -E 's/"(start_url|src)": *"\/([^"]*)"/"\1": ".\/\2"/g' manifest.json
          fi

      - name: gh-pages 브랜치로 배포
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "스테이징 자동배포: ${{ github.sha }}"
          git push origin gh-pages-tmp:gh-pages --force
