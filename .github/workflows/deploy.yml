name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - name: Deploy dah-dashboard
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --name=dah-dashboard
        
  deploy-estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - name: Deploy dah-estimate
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --name=dah-estimate
