name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (dashboard + estimate)
        run: |
          # 응답 확인용 verbose
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "dah-dashboard",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repoId": "1256814444",
                "ref": "main"
              }
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "dashboard HTTP: $HTTP_CODE"
          echo "dashboard 응답: $BODY"

          RESPONSE2=$(curl -s -w "\n%{http_code}" -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "dah-estimate",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repoId": "1256814444",
                "ref": "main"
              }
            }')
          HTTP_CODE2=$(echo "$RESPONSE2" | tail -1)
          BODY2=$(echo "$RESPONSE2" | head -1)
          echo "estimate HTTP: $HTTP_CODE2"
          echo "estimate 응답: $BODY2"
