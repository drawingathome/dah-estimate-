name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy (dah-dashboard)
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_DASHBOARD }}"
