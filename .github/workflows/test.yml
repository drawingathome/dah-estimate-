name: Run Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치 (Puppeteer + TypeScript)
        run: npm install

      - name: 캐시버전 정합성 확인
        run: node scripts/bump-cache-versions.js --check

      - name: 타입체크 (신규 오류 없는지)
        run: node tests/typecheck-check.js

      - name: 대시보드 회귀 테스트
        run: |
          mkdir -p ci-logs
          set -o pipefail
          node tests/run-all.js dah-dashboard.html 2>&1 | tee ci-logs/dashboard.log

      - name: 견적서 앱 회귀 테스트
        run: |
          mkdir -p ci-logs
          set -o pipefail
          node tests/run-all.js dah-estimate.html 2>&1 | tee ci-logs/estimate.log
      - name: 실패 시 원인 줄을 주석으로 남김 (H-32, 로그 파일을 못 내려받아도 API로 읽기)
        if: failure()
        run: bash scripts/ci-failure-annotate.sh ci-logs
      - name: 실패 시 시험 출력 저장 (원인 확인용, H-25)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 14
