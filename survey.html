              React.createElement(FieldLabel, { text:'사이즈 메모 — 커튼은 공간, 블라인드는 창문 기준' }),
              React.createElement('textarea', {
                value: form.sizeNote,
                onChange: e => set('sizeNote', e.target.value),
                placeholder: '예) 거실 커튼 가로 350 × 높이 240\n안방 블라인드 가로 160 × 높이 130\n(모르시면 비워두셔도 돼요)',
                style: s.textarea,
                onFocus: e => e.target.style.borderColor = T.orange,
                onBlur:  e => e.target.style.borderColor = T.border,
              })
            ),
            React.createElement('div', { style:s.divider }),
            React.createElement('div', null,
              React.createElement(FieldLabel, { text:'추가로 전달할 내용 (선택)' }),
              React.createElement('textarea', {
                value: form.memo,
                onChange: e => set('memo', e.target.value),
                placeholder: '예) 기존 레일 있어요 / 반려동물 있어요 / 시공 날짜 정해져 있어요',
                style: { ...s.textarea, minHeight:64 },
                onFocus: e => e.target.style.borderColor = T.orange,
                onBlur:  e => e.target.style.borderColor = T.border,
              })
            ),
          ),

        ) // body
      ), // card

      // ── 하단 버튼 ──
      React.createElement('div', { style:{ display:'flex', gap:8, marginTop:4 } },
        step > 1 && React.createElement('button', { onClick:prev, style:s.btnSecondary }, '이전'),
        step < TOTAL
          ? React.createElement('button', { onClick:next, style:s.btnPrimary(!canNext) }, '다음')
          : React.createElement('button', { onClick:submit, disabled:submitting, style:s.btnPrimary(submitting) },
              submitting ? '제출 중...' : '제출하기')
      ),

      // 건너뛰기 (3,4,5단계)
      step >= 3 && step < TOTAL && React.createElement('button', { onClick:skip, style:s.btnSkip }, '이 단계 건너뛰기'),

    ) // wrapper
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

  </script>
</body>
</html>
